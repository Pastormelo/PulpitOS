<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Shared from PreachFlow</title>
    <link rel="icon" type="image/svg+xml" href="./assets/preach-flow-mark.svg?v=ofc-4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Mulish:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* v2 visual language, same as the app: stark surfaces, hairline rules,
         square corners, no shadows. A share link is a reading page, so the
         prose column stays wide and quiet. Honours the reader's own light or
         dark preference. */
      :root {
        color-scheme: light dark;
        --pf-bg: #ffffff;
        --pf-panel: #ffffff;
        --pf-sunk: #f3f5f7;
        --pf-fg: #14171b;
        --pf-dim: #4a545f;
        --pf-faint: #66707c;
        --pf-line: #d8dde3;
        --pf-rule: #14171b;
        --pf-inv-bg: #14171b;
        --pf-inv-fg: #ffffff;
        --pf-acc: #ff953e;
        --pf-acc-wash: rgba(255, 149, 62, 0.15);
        --pf-acc-text: #a94e00;
        --pf-acc-display: #cc6a10;
        --font-display: "Montserrat", ui-sans-serif, system-ui, sans-serif;
        --font-body: "Mulish", ui-sans-serif, system-ui, sans-serif;
        --pf-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --pf-bg: #0b0d10;
          --pf-panel: #101317;
          --pf-sunk: #161a1f;
          --pf-fg: #f2f5f8;
          --pf-dim: #b0bbc6;
          --pf-faint: #8b96a2;
          --pf-line: #2a3138;
          --pf-rule: #4a535d;
          --pf-inv-bg: #f2f5f8;
          --pf-inv-fg: #0b0d10;
          --pf-acc-text: #ff953e;
          --pf-acc-display: #ff953e;
        }
      }
      * { box-sizing: border-box; border-radius: 0; box-shadow: none; }
      body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--pf-bg);
        color: var(--pf-fg);
        line-height: 1.75;
        font-size: 16.5px;
      }
      p { text-wrap: pretty; }

      .live {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--pf-acc);
        color: #14171b;
        font-family: var(--pf-mono);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        padding: 12px 24px;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: none;
        margin: 0;
        padding: 0 24px;
        height: 58px;
        border-bottom: 2px solid var(--pf-fg);
      }
      .topbar .mark {
        width: 26px;
        height: 26px;
        background: var(--pf-acc);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .topbar span {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 19px;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .topbar b { color: var(--pf-acc-display); font-weight: 900; }

      .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 80px; }
      .paper {
        background: transparent;
        border: 0;
        padding: 44px 0 0;
      }
      @media (max-width: 640px) {
        .paper { padding: 28px 0 0; }
        .topbar { padding: 0 18px; }
        .wrap { padding: 0 18px 60px; }
      }

      .kind {
        font-family: var(--pf-mono);
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        font-size: 11.5px;
        color: var(--pf-acc-text);
        margin: 0 0 14px;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 900;
        margin: 0 0 12px;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 0.94;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .meta {
        color: var(--pf-faint);
        margin: 0;
        font-family: var(--pf-mono);
        font-size: 11px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      .bigidea {
        font-weight: 600;
        margin: 24px 0 0;
        font-size: 18px;
        line-height: 1.55;
        padding: 18px 22px;
        border-left: 3px solid var(--pf-acc);
        background: var(--pf-acc-wash);
        color: var(--pf-fg);
      }
      .section { margin-top: 0; padding: 34px 0; border-bottom: 1px solid var(--pf-line); }
      .section:first-of-type { border-top: 1px solid var(--pf-line); margin-top: 34px; }
      .section + .section { border-top: 0; padding-top: 34px; }
      h2 {
        font-family: var(--pf-mono);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin: 0 0 16px;
        color: var(--pf-dim);
      }
      .block { font-size: 17px; color: var(--pf-fg); }
      .block p { margin: 0 0 14px; }
      .block p:last-child { margin-bottom: 0; }
      .block ul, .block ol { margin: 6px 0 16px; padding-left: 24px; }
      .block li { margin: 6px 0; }
      .block strong { font-weight: 700; }
      .updated {
        margin-top: 40px;
        font-family: var(--pf-mono);
        font-size: 10.5px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--pf-faint);
      }
      .updated a { color: var(--pf-acc-text); }
      .foot {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 24px 40px;
        font-family: var(--pf-mono);
        font-size: 10.5px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--pf-faint);
        text-align: left;
        border-top: 1px solid var(--pf-line);
      }
      .err {
        margin-top: 34px;
        padding: 24px;
        border: 1px solid var(--pf-line);
        border-left: 3px solid var(--pf-acc);
        background: transparent;
      }
      .err strong {
        font-family: var(--font-display);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        font-size: 19px;
      }
    </style>
  </head>
  <body>
    <div id="live" class="live" hidden></div>
    <div class="topbar">
      <span class="mark"><svg width="16" height="16" viewBox="0 0 128 128" fill="none" aria-hidden="true"><path d="M67 8C66 18 74 24 80 32C87 41 90 49 90 58C90 74 79 84 64 84C49 84 38 74 38 58C38 45 47 37 51 24C53 32 58 36 59 30C60 25 58 18 62 12C63 10 65 9 67 8Z" fill="#14171b"/><path d="M64 42C65 49 72 52 74 60C76 68 71 76 64 76C57 76 52 68 54 60C55 54 60 51 61 46C62 49 63 48 64 42Z" fill="#ff953e"/><path d="M16 78C35 72 52 76 64 88C76 76 93 72 112 78L112 92C93 86 76 90 64 101C52 90 35 86 16 92Z" fill="#14171b"/><path d="M64 88L64 101" stroke="#ff953e" stroke-width="3.6" stroke-linecap="round"/></svg></span>
      <span>Preach<b>Flow</b></span>
    </div>
    <div class="wrap" id="root"><p class="meta">Loading…</p></div>
    <p class="foot" id="foot" hidden>Read-only. Shared from PreachFlow - sermon prep that keeps the text in charge.</p>
    <script>
      const root = document.getElementById("root");
      const liveBar = document.getElementById("live");
      const foot = document.getElementById("foot");
      const token = new URLSearchParams(window.location.search).get("t") || "";
      let client = null;

      function esc(value) {
        const div = document.createElement("div");
        div.textContent = String(value || "");
        return div.innerHTML;
      }

      // Blocks arrive as plain text. Give them the sermon's formatting:
      // paragraphs, bold labels, bulleted and numbered lists.
      function formatBlock(text) {
        const inline = (line) => esc(line).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        const lines = String(text || "").replace(/\r/g, "").split("\n");
        const out = [];
        let list = null;
        let para = [];
        const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
        const flushPara = () => {
          if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; }
        };
        for (const raw of lines) {
          const line = raw.trim();
          if (!line) { flushPara(); closeList(); continue; }
          const bullet = line.match(/^[-•*]\s+(.*)$/);
          if (bullet) {
            flushPara();
            if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
            out.push(`<li>${inline(bullet[1])}</li>`);
            continue;
          }
          const numbered = line.match(/^(\d+)[.)]\s+(.*)$/);
          if (numbered) {
            flushPara();
            if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
            out.push(`<li>${inline(numbered[2])}</li>`);
            continue;
          }
          const lead = line.match(/^([A-Z][A-Za-z''\s]{2,40}):\s+(.+)$/);
          if (lead && !line.includes("**")) {
            flushPara();
            closeList();
            out.push(`<p><strong>${inline(lead[1])}:</strong> ${inline(lead[2])}</p>`);
            continue;
          }
          para.push(line);
        }
        flushPara();
        closeList();
        return out.join("");
      }

      function fail(message) {
        root.innerHTML = `<div class="err"><strong>This link isn't available.</strong><p class="meta">${esc(message)}</p></div>`;
      }

      function renderPayload(payload) {
        const header = payload.header || {};
        const metaLine = [header.passage, header.series, header.date].filter(Boolean).join(" · ");
        root.innerHTML = `
          <div class="paper">
            <p class="kind">${esc(payload.label || "Shared resource")}</p>
            <h1>${esc(header.title || header.passage || "Sermon")}</h1>
            ${metaLine ? `<p class="meta">${esc(metaLine)}</p>` : ""}
            ${header.bigIdea ? `<p class="bigidea">${esc(header.bigIdea)}</p>` : ""}
            ${(payload.blocks || []).map((block) => `<div class="section"><h2>${esc(block.label)}</h2><div class="block">${formatBlock(block.text)}</div></div>`).join("")}
            <p class="updated">Last updated ${payload.updatedAt ? new Date(payload.updatedAt).toLocaleString() : "-"} · <a href="#" onclick="location.reload();return false;">Refresh</a></p>
          </div>
        `;
        foot.hidden = false;
        if (payload.kind === "production" && payload.follow && payload.currentSection) {
          liveBar.hidden = false;
          liveBar.textContent = `Now: ${payload.currentSection}`;
        }
      }

      async function load() {
        if (!token) return fail("No share token in the address.");
        try {
          const config = await fetch("./api/config").then((response) => response.json());
          if (!config.supabaseUrl || !config.supabaseAnonKey) return fail("Sharing is not configured for this deployment.");
          if (!client) {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
              script.onload = resolve;
              script.onerror = reject;
              document.head.appendChild(script);
            });
            client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
          }
          const { data, error } = await client.rpc("preach_flow_get_shared_view", { share_token: token });
          if (error) return fail(error.message);
          if (!data) return fail("The link may have been revoked, expired, or never existed.");
          renderPayload(data);
          if (data.kind === "production" && data.follow) setTimeout(load, 20000);
        } catch (error) {
          fail(error.message || "Network error.");
        }
      }
      load();
    </script>
  </body>
</html>
